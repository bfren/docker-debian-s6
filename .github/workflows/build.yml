name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@main
    with:
      image: debian-s6
      folders: |
        12
        13
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        debian${FOLDER}
        debian${FOLDER}-${VERSION_MAJOR}
        debian${FOLDER}-${VERSION_MINOR}
        debian${FOLDER}-${VERSION}
        debian${DEBIAN_MINOR}
        debian${DEBIAN_MINOR}-${VERSION}
        ${DEBIAN_NAME}
        ${DEBIAN_NAME}-${VERSION_MAJOR}
        ${DEBIAN_NAME}-${VERSION_MINOR}
        ${DEBIAN_NAME}-${VERSION}
      default-folder: "13"
      default-tags: |
        latest
        ${VERSION_MAJOR}
        ${VERSION_MINOR}
        ${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
